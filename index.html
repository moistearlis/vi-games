<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vim Typing Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/dialog/dialog.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Vim Typing Game</h1>
    <div class="container">
        <div class="game-info">
            <p>Target Word: <span id="target-word"></span></p>
            <p>Score: <span id="score">0</span></p>
        </div>
        <div id="editor"></div>
    </div>

    <!-- Modal for results -->
    <div id="result-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="result-message"></h2>
            <p>Press Enter to continue</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/dialog/dialog.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/keymap/vim.js"></script>
    <script src="script.js"></script>
</body>
</html>
